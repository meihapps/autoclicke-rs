[package]
name = "autoclicke-rs"
version = "0.1.0"
edition = "2021"
description = "Linux GUI autoclicker with configurable interval, hotkeys, still-threshold, and duration limit"
license = "MIT"
repository = "https://github.com/meihapps/autoclicke-rs"
keywords = ["autoclicker", "linux", "evdev", "egui", "input"]
categories = ["gui", "command-line-utilities"]

[dependencies]
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
evdev = "0.12"
parking_lot = "0.12"

[profile.release]
opt-level = 3
